<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        /*
            Ejercicio 1 - Datos personales
            • Crea tres variables llamadas nombre, edad y ciudad.
            • Asigna un valor a cada variable.
            • Muestra los tres datos en la página utilizando document.write().
            Ejemplo de salida:
            Nombre: Laura
            Edad: 25
            Ciudad: Gijón

            Ejercicio 2 - Datos de un producto
            • Crea las variables producto, precio y cantidad.
            • Asigna valores a las tres variables.
            • Crea una nueva variable llamada total que calcule el resultado de multiplicar el precio por la
            cantidad.
            • Muestra todos los datos y el total utilizando document.write().
            Ejemplo de salida:
            Producto: Teclado
            Precio: 30 EUR
            Cantidad: 2
            Total: 60 EUR

            Ejercicio 3 - Cálculo de edad
            • Crea una variable nombre con el nombre de una persona.
            • Crea una variable anioNacimiento con su año de nacimiento.
            • Crea otra variable anioActual con el valor 2026.
            • Crea una variable edad que calcule la edad aproximada restando el año de nacimiento al año actual.
            • Muestra una frase completa utilizando document.write().
            Ejemplo de salida:
            Ana nació en 1990 y tiene aproximadamente 36 años.

            Ejercicio 4 - Precio con descuento
            • Una tienda tiene un producto llamado Monitor, con un precio de 200 EUR y un descuento del 15 %.
            • Crea las variables necesarias para guardar esos datos.
            • Calcula cuánto dinero se descuenta y guárdalo en una nueva variable.
            • Calcula el precio final después de aplicar el descuento.
            • Muestra el producto, precio original, porcentaje de descuento, cantidad descontada y precio final con
            document.write().
            Resultado esperado:
            Producto: Monitor
            Precio original: 200 EUR
            Descuento: 15 %
            Cantidad descontada: 30 EUR
            Precio final: 170 EUR

            Ejercicio 5 - Compra completa
            • Crea las variables producto, precio, cantidad, descuento y gastosEnvio.
            • Utiliza como datos: Portátil, 650 EUR, 2 unidades, 10 % de descuento y 15 EUR de gastos de envío.
            • Crea nuevas variables para calcular: el subtotal, la cantidad descontada, el precio después del
            descuento y el precio final añadiendo los gastos de envío.
            • Muestra todo el resumen de la compra utilizando document.write().
            • Utiliza etiquetas HTML dentro de document.write() para organizar la información en varias líneas.
            Resultado esperado:
            RESUMEN DE COMPRA
            Producto: Portátil
            Precio unidad: 650 EUR
            Cantidad: 2
            Subtotal: 1300 EUR
            Descuento: 10 %
            Descuento aplicado: 130 EUR
            Gastos de envío: 15 EUR
            TOTAL: 1185 EUR
        */
       
        function ejercicio1(){
            //ejercicio 1 - Ejercicio 1 - Datos personales
            let nombre="Daniel";
            let edad=44;
            let ciudad="Gijon";
            document.write("Ejercicio 1 - Datos personales")
            document.write("<br>")
            document.write("Nombre: ", nombre)
            document.write("<br>")
            document.write("Edad: ", edad)
            document.write("<br>")
            document.write("Ciudad: ", ciudad)
            //• Crea tres variables llamadas nombre, edad y ciudad.
            //• Asigna un valor a cada variable.
            //• Muestra los tres datos en la página utilizando document.write().
            //Ejemplo de salida:
            //Nombre: Laura
            //Edad: 25
            //Ciudad: Gijón
        }

        function ejercicio2(){
            /*
                Ejercicio 2 - Datos de un producto
                • Crea las variables producto, precio y cantidad.
                • Asigna valores a las tres variables.
                • Crea una nueva variable llamada total que calcule el resultado de multiplicar el precio por la
                cantidad.
                • Muestra todos los datos y el total utilizando document.write().
                Ejemplo de salida:
                Producto: Teclado
                Precio: 30 EUR
                Cantidad: 2
                Total: 60 EUR
            */
           let producto = "Teclado"
           let precio = 30
           let cantidad = 2

           document.write("<br>")
           document.write("<br>")
           document.write("Ejercicio 2 - Datos de un producto")
           document.write("<br>")
           document.write("Producto: ", producto)
           document.write("<br>")
           document.write("Precio: ", precio," EUR")
           document.write("<br>")
           document.write("Cantidad: ", (precio*cantidad)," EUR")
           document.write("<br>")
        }

        function ejercicio3(){
            /*
                Ejercicio 3 - Cálculo de edad
                • Crea una variable nombre con el nombre de una persona.
                • Crea una variable anioNacimiento con su año de nacimiento.
                • Crea otra variable  con el valor 2026.
                • Crea una variable edad que calcule la edad aproximada restando el año de nacimiento al año actual.
                • Muestra una frase completa utilizando document.write().
                Ejemplo de salida:
                Ana nació en 1990 y tiene aproximadamente 36 años.
            */
            let nombre = "Daniel"
            let anioNacimiento = 1982
            let anioActual= 2026
            let edad = (anioActual-anioNacimiento)

            document.write("<br>")
            document.write("<br>")
            document.write("Ejercicio 3 - Cálculo de edad")
            document.write("<br>")
            document.write(nombre," nacio en ",anioNacimiento," y tiene aproximadamente ", edad," años")
        }

        function ejercicio4(){
            /*
            Ejercicio 4 - Precio con descuento
            • Una tienda tiene un producto llamado Monitor, con un precio de 200 EUR y un descuento del 15 %.
            • Crea las variables necesarias para guardar esos datos.
            • Calcula cuánto dinero se descuenta y guárdalo en una nueva variable.
            • Calcula el precio final después de aplicar el descuento.
            • Muestra el producto, precio original, porcentaje de descuento, cantidad descontada y precio final con
            document.write().
            Resultado esperado:
            Producto: Monitor
            Precio original: 200 EUR
            Descuento: 15 %
            Cantidad descontada: 30 EUR
            Precio final: 170 EUR
            */

           let producto = "Monitor"
           let precio = 200
           let descuento = 15
           let montoDescontado    

           montoDescontado=(precio/100)*descuento

           preciofinal=(precio-montoDescontado)

            document.write("<br>")
            document.write("<br>")
            document.write("Ejercicio 4 - Precio con descuento")
            document.write("<br>")
            document.write("Producto: ",producto)
            document.write("<br>")
            document.write("Precio Original: ",precio)
            document.write("<br>")
            document.write("Descuento: ",descuento, " %")
            document.write("<br>")
            document.write("Cantidad descontada: ",montoDescontado," EUR")
            document.write("<br>")
            document.write("Precio final: ",preciofinal," EUR")

        }
        function ejercicio5(){
            /*
                Ejercicio 5 - Compra completa
                • Crea las variables producto, precio, cantidad, descuento y gastosEnvio.
                • Utiliza como datos: Portátil, 650 EUR, 2 unidades, 10 % de descuento y 15 EUR de gastos de envío.
                • Crea nuevas variables para calcular: el subtotal, la cantidad descontada, el precio después del
                descuento y el precio final añadiendo los gastos de envío.
                • Muestra todo el resumen de la compra utilizando document.write().
                • Utiliza etiquetas HTML dentro de document.write() para organizar la información en varias líneas.
                Resultado esperado:
                RESUMEN DE COMPRA
                Producto: Portátil
                Precio unidad: 650 EUR
                Cantidad: 2
                Subtotal: 1300 EUR
                Descuento: 10 %
                Descuento aplicado: 130 EUR
                Gastos de envío: 15 EUR
                TOTAL: 1185 EUR
            */

            let producto = "Portátil"
            let precio = 650
            let cantidad = 2
            let descuento = 10
            let subTotal=precio*cantidad
            let montoDescontado = (subTotal/100)*descuento
            let gastosEnvio=15
            let total=(subTotal-montoDescontado)+gastosEnvio
            

            document.write("<br>")
            document.write("<br>")
            document.write("Ejercicio 5 - Compra completa")
            document.write("<br>")

            document.write("RESUMEN DE COMPRA")
            document.write("<br>")
            document.write("Producto: ",producto)
            document.write("<br>")
            document.write("Precio unidad: ", precio," EUR")
            document.write("<br>")
            document.write("Cantidad: ", cantidad)
            document.write("<br>")
            document.write("Subtotal: ",subTotal," EUR")
            document.write("<br>")
            document.write("Descuento: ",descuento," %")
            document.write("<br>")
            document.write("Descuento aplicado: ",montoDescontado," EUR")
            document.write("<br>")
            document.write("Gastos de envío: ",gastosEnvio," EUR")
            document.write("<br>")
            document.write("TOTAL: ", total," EUR")
            document.write("<br>")

        }
        ejercicio1()
        ejercicio2()
        ejercicio3()
        ejercicio4()
        ejercicio5()
    </script>
</body>
</html>
